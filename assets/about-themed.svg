<svg xmlns="http://www.w3.org/2000/svg" width="680" height="212" viewBox="0 0 680 212" role="img"><title>About me</title><defs><linearGradient id="bg"><stop stop-color="#160f18"/><stop offset="1" stop-color="#321522"/></linearGradient></defs><rect x="1" y="1" width="678" height="210" rx="16" fill="url(#bg)" stroke="#513244"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="38" fill="#edcf92" font-size="23" font-weight="600">About me</text><path d="M24 54H656" stroke="#513244"/><text x="24" y="86" fill="#e6dce2" font-size="15" font-weight="400">I&#x27;m David, a Computer Science student from Indonesia focused on web and</text><text x="24" y="110" fill="#e6dce2" font-size="15" font-weight="400">mobile development, with an interest in AI agents and workflow automation.</text><text x="24" y="146" fill="#e6dce2" font-size="15" font-weight="400">I build web and Flutter apps, connect language models to useful tools, and</text><text x="24" y="170" fill="#e6dce2" font-size="15" font-weight="400">explore game development, machine learning, and Arduino.</text></g></svg>