<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" role="img"><title>Animated constellation connecting David to web, mobile, AI agents, music, games and creative work. Decorative illustration, not live agent telemetry.</title><rect width="900" height="268" rx="18" fill="#160f18"/><g font-family="Segoe UI,Arial,sans-serif"><defs><radialGradient id="halo"><stop stop-color="#883b5b" stop-opacity=".55"/><stop offset="1" stop-color="#160f18" stop-opacity="0"/></radialGradient></defs><ellipse cx="450" cy="130" rx="330" ry="120" fill="url(#halo)"/><path id="route0" d="M450 128 L185 72" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="3.0s" begin="-0s" repeatCount="indefinite" path="M450 128 L185 72"/><animate attributeName="opacity" values="0;1;0" dur="3.0s" repeatCount="indefinite"/></circle><path id="route1" d="M450 128 L710 72" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="3.4s" begin="-1s" repeatCount="indefinite" path="M450 128 L710 72"/><animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/></circle><path id="route2" d="M450 128 L155 196" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="3.8s" begin="-2s" repeatCount="indefinite" path="M450 128 L155 196"/><animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite"/></circle><path id="route3" d="M450 128 L745 196" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="4.2s" begin="-3s" repeatCount="indefinite" path="M450 128 L745 196"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/></circle><path id="route4" d="M450 128 L450 42" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="4.6s" begin="-4s" repeatCount="indefinite" path="M450 128 L450 42"/><animate attributeName="opacity" values="0;1;0" dur="4.6s" repeatCount="indefinite"/></circle><path id="route5" d="M450 128 L450 224" fill="none" stroke="#634052" stroke-width="1.2"/><circle r="3" fill="#e1be7c"><animateMotion dur="5.0s" begin="-5s" repeatCount="indefinite" path="M450 128 L450 224"/><animate attributeName="opacity" values="0;1;0" dur="5.0s" repeatCount="indefinite"/></circle><circle cx="450" cy="128" r="25" fill="#241622" stroke="#ddbc7e"/><text x="450" y="132" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#ebd8b5">DAVID</text><circle cx="185" cy="72" r="6" fill="#241622" stroke="#ddbc7e"/><text x="185" y="96" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">WEB</text><circle cx="710" cy="72" r="6" fill="#241622" stroke="#ddbc7e"/><text x="710" y="96" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">MOBILE</text><circle cx="155" cy="196" r="6" fill="#241622" stroke="#ddbc7e"/><text x="155" y="220" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">MUSIC</text><circle cx="745" cy="196" r="6" fill="#241622" stroke="#ddbc7e"/><text x="745" y="220" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">GAMES</text><circle cx="450" cy="42" r="6" fill="#241622" stroke="#ddbc7e"/><text x="450" y="66" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">AI AGENTS</text><circle cx="450" cy="224" r="6" fill="#241622" stroke="#ddbc7e"/><text x="450" y="248" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#ebd8b5">CREATIVE</text><circle cx="450" cy="128" r="28" fill="none" stroke="#ddbc7e" opacity=".4"><animate attributeName="r" values="28;44;28" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="5s" repeatCount="indefinite"/></circle><text x="26" y="28" fill="#bc99aa" font-size="10" letter-spacing="3">THE CONNECTIONS BEHIND THE CODE</text></g></svg>