<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" role="img"><title>Beyond the editor</title><defs><linearGradient id="bg"><stop stop-color="#160f18"/><stop offset="1" stop-color="#321522"/></linearGradient></defs><rect x="1" y="1" width="678" height="148" rx="16" fill="url(#bg)" stroke="#513244"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="38" fill="#edcf92" font-size="23" font-weight="600">Beyond the editor</text><path d="M24 54H656" stroke="#513244"/><text x="24" y="84" fill="#e6dce2" font-size="15" font-weight="400">Photography, videography, video editing, and content creation. I also play</text><text x="24" y="108" fill="#e6dce2" font-size="15" font-weight="400">guitar and bass, and enjoy AAA games, especially FPS and adventure titles.</text></g></svg>